<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>발표자료 보관함</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/themes/editorial-serif.css">
<style>
  body{word-break:keep-all;min-height:100vh}
  main{max-width:960px;margin:0 auto;padding:96px 24px 80px}
  h1{font-family:var(--font-serif);font-size:clamp(36px,6vw,56px);font-weight:700;line-height:1.2;margin:8px 0 12px}
  .intro{color:var(--text-2);font-size:18px;margin:0 0 48px}
  .list{list-style:none;margin:0;padding:0;border-top:1px solid var(--border-strong)}
  .list li{border-bottom:1px solid var(--border)}
  .list a{display:grid;grid-template-columns:1fr auto;gap:8px 24px;padding:28px 4px;color:inherit;text-decoration:none}
  .list a:hover h2{color:var(--accent)}
  .list h2{font-family:var(--font-serif);font-size:28px;font-weight:700;margin:0;transition:color .2s}
  .list p{grid-column:1;margin:0;color:var(--text-2);font-size:16px;line-height:1.6}
  .list .meta{grid-column:2;grid-row:1/3;align-self:center;color:var(--text-3);font-size:14px;white-space:nowrap}
  .help{margin-top:48px;color:var(--text-3);font-size:14px;line-height:1.8}
  kbd{font-family:var(--font-mono);font-size:12px;padding:1px 6px;border:1px solid var(--border-strong);border-radius:3px;background:var(--surface)}
  @media (max-width:600px){.list a{grid-template-columns:1fr}.list .meta{grid-column:1;grid-row:auto}}
</style>
</head>
<body>
<main>
  <p class="kicker">Presentation Archive</p>
  <h1>발표자료 보관함</h1>
  <p class="intro">html-ppt로 만든 발표자료를 모아 둔 곳입니다. 제목을 누르면 슬라이드가 열립니다.</p>
  <ul class="list">
    <li>
      <a href="decks/proust-in-search-of-lost-time/">
        <h2>잃어버린 시간을 찾아서</h2>
        <p>마르셀 프루스트의 소설을 처음 만나는 사람을 위한 안내. 작가와 시대, 등장인물, 7권 줄거리, 핵심 주제.</p>
        <span class="meta">21장 · 2026.10</span>
      </a>
    </li>
  </ul>
  <p class="help">슬라이드 조작: <kbd>←</kbd> <kbd>→</kbd> 넘기기 · <kbd>F</kbd> 전체 화면 · <kbd>S</kbd> 발표자 창 · <kbd>O</kbd> 전체 보기</p>
</main>
</body>
</html>
